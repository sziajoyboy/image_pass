name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:plugin
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run cf:dry-run
      - name: MCP smoke
        run: |
          npm start > /tmp/image-pass.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke:mcp
